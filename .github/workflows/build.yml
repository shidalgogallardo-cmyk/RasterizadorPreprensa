name: Compilar RasterizadorPreprensa

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt5 Pillow pypdf

    - name: Compilar para macOS
      if: startsWith(matrix.os, 'macos')
      run: |
        pyinstaller --noconfirm --onedir --windowed --name="RasterizadorPreprensa" --icon="icono.icns" --collect-all PyQt5 --collect-all PIL --collect-all pypdf prepress_app.py

    - name: Compilar para Windows
      if: startsWith(matrix.os, 'windows')
      run: |
        pyinstaller --noconfirm --onedir --windowed --name="RasterizadorPreprensa" --icon="icono.ico" --collect-all PyQt5 --collect-all PIL --collect-all pypdf prepress_app.py

    - name: Comprimir artefacto Windows
      if: startsWith(matrix.os, 'windows')
      run: |
        Compress-Archive -Path dist/RasterizadorPreprensa -DestinationPath dist/RasterizadorPreprensa-Windows.zip

    - name: Subir artefacto macOS
      if: startsWith(matrix.os, 'macos')
      uses: actions/upload-artifact@v4
      with:
        name: RasterizadorPreprensa-Mac
        path: dist/RasterizadorPreprensa.app

    - name: Subir artefacto Windows
      if: startsWith(matrix.os, 'windows')
      uses: actions/upload-artifact@v4
      with:
        name: RasterizadorPreprensa-Windows
        path: dist/RasterizadorPreprensa-Windows.zip
