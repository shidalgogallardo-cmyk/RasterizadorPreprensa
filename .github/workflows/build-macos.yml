name: Build macOS App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: AppleSilicon
            runner: macos-latest
          - suffix: Intel
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar app con PyInstaller
        run: |
          pyinstaller --noconfirm --windowed \
            --name "RasterizadorDePDFs" \
            --icon "icono.icns" \
            --add-data "WAN-IFRAnewspaper26v5.icc:." \
            --add-data "icono.icns:." \
            rasterizador_pdfs.py

      - name: Crear DMG
        run: |
          mkdir -p dist/dmg
          cp -R "dist/RasterizadorDePDFs.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "RasterizadorDePDFs" \
            -srcfolder dist/dmg \
            -ov -format UDZO \
            "dist/RasterizadorDePDFs-${{ matrix.suffix }}.dmg"

      - name: Subir artefacto (.app y .dmg)
        uses: actions/upload-artifact@v4
        with:
          name: RasterizadorDePDFs-macOS-${{ matrix.suffix }}
          path: |
            dist/RasterizadorDePDFs-${{ matrix.suffix }}.dmg
            dist/RasterizadorDePDFs.app

      - name: Crear Release (solo si es un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RasterizadorDePDFs-${{ matrix.suffix }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
